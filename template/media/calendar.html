{% load static %}
{% include 'header.html' %}

<style>
.calendar-wrap{
    max-width:900px;
    margin:80px auto;
    padding:0 20px;
    margin-top: 60px;
}

.calendar-header{
    text-align:center;
    margin-bottom:20px;
}

.calendar-header h2{
    font-size:40px;
    color:#23395d;
}

/* BAR */
.calendar-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: #dd7e43;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
}

.calendar-bar button{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* WEEKDAYS */
.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-weight:600;
    margin:15px 0;
    color:#23395d;
}

/* CALENDAR */
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.day{
    background:#fff;
    border:1px solid #eee;
    height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:10px;
    position:relative;
    transition:0.3s;
}

.day:hover{
    background:#fff2e8;
    transform:scale(1.05);
}

/* EVENT MARK */
.day.has-event{
    border:2px solid  #dd7e43;
    background:rgba(231,101,20,0.12);
    font-weight:700;
    color: #dd7e43;
}

.dot{
    width:8px;
    height:8px;
    background: #dd7e43;
    border-radius:50%;
    position:absolute;
    bottom:8px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.6);opacity:0.5;}
    100%{transform:scale(1);opacity:1;}
}

/* POPUP FIXED */.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeIn 0.3s ease;
}

/* ANIMATION */
@keyframes fadeIn{
    from {opacity:0;}
    to {opacity:1;}
}

/* POPUP BOX */
.popup-box{
    background:rgba(255,255,255,0.95);
    padding:30px 25px;
    width:340px;
    border-radius:18px;
    text-align:center;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    transform:translateY(20px);
    animation:slideUp 0.35s ease forwards;
    border:1px solid rgba(231,101,20,0.2);
}

/* SLIDE ANIMATION */
@keyframes slideUp{
    to{
        transform:translateY(0);
    }
}

/* TITLE */
.popup-box h3{
    font-size:20px;
    color:#23395d;
    margin-bottom:10px;
    font-weight:700;
}

/* TEXT */
.popup-box p{
    font-size:15px;
    color:#555;
    line-height:1.6;
}

/* CLOSE BUTTON */
.close{
    position:absolute;
    right:12px;
    top:10px;
    font-size:22px;
    cursor:pointer;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#f5f5f5;
    transition:0.3s;
}

.close:hover{
    background: #dd7e43;
    color:#fff;
    transform:rotate(90deg);
}
</style>

<section class="calendar-wrap">

    <div class="calendar-header">
        <h2>Church Calendar</h2>
        <p>Click any date to view programs</p>
    </div>

    <div class="calendar-bar">
        <button onclick="changeMonth(-1)">❮</button>
        <h3 id="monthTitle"></h3>
        <button onclick="changeMonth(1)">❯</button>
    </div>

    <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div id="calendar" class="calendar"></div>

</section>
</div>
<!-- POPUP -->
<div id="popup" class="popup">
    <div class="popup-box">
        <span onclick="closePopup()" class="close">&times;</span>
        <h3 id="popupDate"></h3>
        <p id="popupEvents"></p>
    </div>
</div>

<script>
const toggleBtn = document.getElementById('sidebarToggleBtn');
const sidebar = document.getElementById('sidebarPanel');
const overlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('active');
    toggleBtn.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
    toggleBtn.classList.remove('active');
    document.body.style.overflow = '';
}

toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sidebar.classList.contains('open')) {
        closeSidebar();
    } else {
        openSidebar();
    }
});

overlay.addEventListener('click', closeSidebar);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
        closeSidebar();
    }
});
</script>

<script>
document.querySelectorAll(".menu-link").forEach(link => {
    link.addEventListener("click", function () {
        const dropdown = this.parentElement;

        document.querySelectorAll(".dropdown").forEach(item => {
            if (item !== dropdown) {
                item.classList.remove("active");
            }
        });

        dropdown.classList.toggle("active");
    });
});
</script>
<script>const historyBlocks = document.querySelectorAll('.history-block');

window.addEventListener('scroll', () => {
    historyBlocks.forEach(block => {
        const rect = block.getBoundingClientRect();
        
        // This check defines the "active" zone (the center of your screen)
        const isMiddle = rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2;

        if (isMiddle) {
            // Change to active color while scrolling
            block.style.setProperty('--line-color', '#e76514');
        } else {
            // Reset to inactive color when not scrolling over this block
            block.style.setProperty('--line-color', 'rgba(231, 101, 20, 0.2)');
        }
    });
});
</script>
<script>
let current = new Date();

/* EVENTS */
const events = {
   
    "2026-08-15": "Independence Day ",
    "2026-09-18": "Prayer Day",
    "2026-10-20": "Prayer Day",
    "2026-11-21": "Prayer Day",
    "2026-12-25": "Christmas"
};

function renderCalendar(){

    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    let year = current.getFullYear();
    let month = current.getMonth();

    let firstDay = new Date(year, month, 1).getDay();
    let days = new Date(year, month+1, 0).getDate();

    const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    document.getElementById("monthTitle").innerText =
        monthNames[month] + " " + year;

    for(let i=0;i<firstDay;i++){
        cal.innerHTML += `<div></div>`;
    }

    for(let d=1; d<=days; d++){

        let dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        cal.innerHTML += `
            <div class="day ${events[dateKey] ? 'has-event' : ''}"
                 onclick="openEvent('${dateKey}')">
                ${d}
                ${events[dateKey] ? '<div class="dot"></div>' : ''}
            </div>
        `;
    }
}

function openEvent(date){

    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupDate").innerText = date;

    let data = events[date];

    /* ✅ FIX: prevent layout issues */
    document.getElementById("popupEvents").innerText =
        data || "No programs on this day.";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function changeMonth(step){
    current.setMonth(current.getMonth() + step);
    renderCalendar();
}

window.onclick = function(e){
    if(e.target.id === "popup"){
        closePopup();
    }
}

renderCalendar();
</script>
