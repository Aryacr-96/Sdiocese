{% load static %}
{% include 'header.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Calendar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========================================
           ROOT VARIABLES - STANDARD COLORS
        ======================================== */
        :root {
            --primary: #1a2940;           /* Navy Blue */
            --primary-hover: #0f1a2e;
            --primary-light: #e8edf5;
            --primary-dark: #0a1420;
            --secondary: #c8963e;          /* Warm Gold */
            --secondary-light: #f8f0e0;
            --secondary-dark: #a87a30;
            --accent: #d4a84c;             /* Golden */
            --success: #2d7d46;
            --danger: #b22222;
            --text-dark: #1a1a2e;
            --text-muted: #5a6a7e;
            --text-light: #8a9aaa;
            --bg-main: #f5f7fa;
            --bg-white: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(26, 41, 64, 0.08);
            --shadow-md: 0 4px 20px rgba(26, 41, 64, 0.10);
            --shadow-lg: 0 10px 40px rgba(26, 41, 64, 0.12);
            --shadow-xl: 0 20px 60px rgba(26, 41, 64, 0.15);
            --shadow-gold: 0 4px 20px rgba(200, 150, 62, 0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
           
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ========================================
           CALENDAR WRAPPER
        ======================================== */
        .calendar-wrap {
            max-width: 1100px;
            margin: 100px auto 60px;
            padding: 0 24px;
        }

        /* ========================================
           HEADER
        ======================================== */
        .calendar-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .calendar-header h2 {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .calendar-header h2 i {
            color: var(--secondary);
            font-size: 38px;
        }

        .calendar-header p {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        /* ========================================
           STATS BAR
        ======================================== */
        .calendar-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 0 0 24px 0;
            flex-wrap: wrap;
        }

        .calendar-stats .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-muted);
            background: var(--bg-white);
            padding: 8px 24px;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .calendar-stats .stat:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .calendar-stats .stat i {
            color: var(--secondary);
            font-size: 16px;
        }

        .calendar-stats .stat span {
            font-weight: 700;
            color: var(--text-dark);
        }

        /* ========================================
           CALENDAR BAR - NAVY BLUE
        ======================================== */
        .calendar-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            color: #fff;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }

        .calendar-bar button {
            background: rgba(255,255,255,0.12);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            font-weight: 600;
        }

        .calendar-bar button:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }

        .calendar-bar h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.01em;
        }

        /* ========================================
           MONTH SELECTOR
        ======================================== */
        .month-selector {
            text-align: center;
            margin: 16px 0 24px;
        }

        .month-selector form {
            display: inline-flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--bg-white);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .month-selector select {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 14px;
            background: var(--bg-white);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-dark);
            transition: var(--transition);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .month-selector select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(200, 150, 62, 0.15);
        }

        .month-selector .btn-go {
            padding: 8px 24px;
            background: var(--secondary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .month-selector .btn-go:hover {
            background: var(--secondary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        /* ========================================
           WEEKDAYS
        ======================================== */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            margin: 20px 0 12px;
            color: var(--text-muted);
            padding: 12px 0;
            background: var(--bg-white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .weekdays div {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ========================================
           CALENDAR GRID
        ======================================== */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            height: 100px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            border-radius: var(--radius-md);
            position: relative;
            transition: var(--transition);
            font-weight: 500;
            font-size: 16px;
            color: var(--text-dark);
            padding: 8px;
        }

        .day:hover {
            background: var(--primary-light);
            transform: translateY(-4px) scale(1.02);
            z-index: 1;
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .day.empty {
            background: transparent;
            border: 1px solid transparent;
            cursor: default;
            box-shadow: none;
        }

        .day.empty:hover {
            transform: none;
            background: transparent;
            box-shadow: none;
            border-color: transparent;
        }

        .day .date-number {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-dark);
        }

        /* ========================================
           TODAY HIGHLIGHT
        ======================================== */
        .day.today {
            border: 2px solid var(--primary);
            background: var(--primary-light);
        }

        .day.today .date-number {
            color: var(--primary);
            font-weight: 800;
        }

        .day.today::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--secondary);
        }

        /* ========================================
           EVENT MARK
        ======================================== */
        .day.has-event {
            border: 2px solid var(--secondary);
            background: var(--secondary-light);
        }

        .day.has-event .date-number {
            color: var(--primary-dark);
            font-weight: 700;
        }

        .day.has-event:hover {
            border-color: var(--secondary);
            background: #f8f0e0;
        }

        .day .event-indicators {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .day .event-indicators .mini-dot {
            width: 6px;
            height: 6px;
            background: var(--secondary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .day .event-indicators .mini-dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .day .event-indicators .mini-dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.4; }
        }

        .day .event-count {
            font-size: 9px;
            font-weight: 700;
            background: var(--secondary);
            color: #fff;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -6px;
            right: -6px;
            padding: 0 5px;
            box-shadow: var(--shadow-gold);
        }

        /* ========================================
           POPUP
        ======================================== */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 41, 64, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-box {
            background: var(--bg-white);
            padding: 36px 32px;
            width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: var(--radius-lg);
            text-align: center;
            position: relative;
            box-shadow: var(--shadow-xl);
            transform: translateY(20px);
            animation: slideUp 0.35s ease forwards;
            border: 1px solid rgba(200, 150, 62, 0.2);
            border-top: 4px solid var(--secondary);
        }

        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        .popup-box::-webkit-scrollbar {
            width: 4px;
        }

        .popup-box::-webkit-scrollbar-track {
            background: var(--bg-main);
            border-radius: 10px;
        }

        .popup-box::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }

        .popup-box h3 {
            font-size: 22px;
            color: var(--text-dark);
            margin-bottom: 4px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .popup-box .popup-date {
            font-size: 14px;
            color: var(--secondary-dark);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .popup-box .event-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .popup-box .event-list li {
            padding: 14px 16px;
            margin-bottom: 10px;
            background: var(--bg-main);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--secondary);
            transition: var(--transition);
        }

        .popup-box .event-list li:hover {
            background: var(--secondary-light);
            transform: translateX(6px);
            border-left-color: var(--primary);
        }

        .popup-box .event-list li .event-title {
            font-weight: 700;
            color: var(--text-dark);
            display: block;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .popup-box .event-list li .event-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .popup-box .event-list li .event-meta i {
            margin-right: 4px;
            color: var(--secondary-dark);
            width: 16px;
        }

        .popup-box .event-list li .event-meta .location i {
            color: var(--primary);
        }

        .no-events-msg {
            color: var(--text-light);
            font-size: 16px;
            padding: 30px 0;
        }

        .close {
            position: absolute;
            right: 14px;
            top: 12px;
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-main);
            transition: var(--transition);
            border: none;
            color: var(--text-muted);
            font-weight: 700;
        }

        .close:hover {
            background: var(--primary);
            color: #fff;
            transform: rotate(90deg);
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 768px) {
            .calendar-wrap {
                margin: 80px auto 40px;
                padding: 0 16px;
            }

            .calendar-header h2 {
                font-size: 30px;
            }

            .calendar-header h2 i {
                font-size: 28px;
            }

            .calendar-bar {
                padding: 12px 16px;
            }

            .calendar-bar h3 {
                font-size: 18px;
            }

            .day {
                height: 75px;
                min-height: 70px;
                font-size: 14px;
                padding: 4px;
            }

            .day .date-number {
                font-size: 15px;
            }

            .weekdays {
                font-size: 11px;
                padding: 8px 0;
            }

            .popup-box {
                width: 92%;
                padding: 24px 20px;
            }

            .calendar-stats {
                gap: 12px;
            }

            .calendar-stats .stat {
                font-size: 12px;
                padding: 6px 16px;
            }

            .month-selector form {
                padding: 6px 12px;
                border-radius: var(--radius-md);
            }

            .month-selector select {
                padding: 6px 12px;
                font-size: 12px;
            }

            .month-selector .btn-go {
                padding: 6px 16px;
                font-size: 12px;
            }

            .day .event-count {
                min-width: 18px;
                height: 18px;
                font-size: 8px;
                top: -4px;
                right: -4px;
            }

            .popup-box .event-list li .event-meta {
                font-size: 12px;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .calendar-wrap {
                margin: 70px auto 30px;
                padding: 0 10px;
            }

            .calendar-header h2 {
                font-size: 24px;
            }

            .calendar-bar h3 {
                font-size: 15px;
            }

            .calendar-bar button {
                font-size: 16px;
                padding: 4px 10px;
            }

            .day {
                height: 60px;
                min-height: 55px;
                border-radius: var(--radius-sm);
                gap: 2px;
            }

            .day .date-number {
                font-size: 13px;
            }

            .weekdays {
                font-size: 9px;
                padding: 6px 0;
            }

            .weekdays div {
                font-size: 9px;
            }

            .calendar {
                gap: 4px;
            }

            .day .event-indicators .mini-dot {
                width: 4px;
                height: 4px;
            }

            .popup-box {
                padding: 20px 16px;
            }

            .popup-box h3 {
                font-size: 18px;
            }

            .popup-box .event-list li {
                padding: 10px 12px;
            }

            .popup-box .event-list li .event-title {
                font-size: 13px;
            }

            .calendar-stats .stat {
                font-size: 10px;
                padding: 4px 12px;
            }

            .month-selector form {
                gap: 6px;
                padding: 4px 10px;
            }

            .month-selector select {
                padding: 4px 8px;
                font-size: 11px;
            }

            .month-selector .btn-go {
                padding: 4px 12px;
                font-size: 11px;
            }
        }

        /* Scrollbar styling for popup */
        .popup-box::-webkit-scrollbar {
            width: 4px;
        }

        .popup-box::-webkit-scrollbar-track {
            background: var(--bg-main);
            border-radius: 10px;
        }

        .popup-box::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<section class="calendar-wrap">

        <h2>

    <!-- ===== STATS ===== -->

<!-- ========================================
   JAVASCRIPT
======================================== -->
<script>
    // ===== CALENDAR DATA FROM DJANGO =====n
    const eventsData = {{ events_dict|safe }};
    const currentYear = {{ year }};
    const currentMonth = {{ month }};

    // Get current date for highlighting
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + 
        String(today.getMonth() + 1).padStart(2, '0') + '-' + 
        String(today.getDate()).padStart(2, '0');

    // Month names
    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    // ===== RENDER CALENDAR =====
    function renderCalendar(year, month) {
        const cal = document.getElementById("calendar");
        cal.innerHTML = "";

        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();

        // Update month title
        document.getElementById("monthTitle").innerText = monthNames[month - 1] + " " + year;

        // Empty cells for days before month starts
        for (let i = 0; i < firstDay; i++) {
            cal.innerHTML += `<div class="day empty"></div>`;
        }

        // Render each day
        for (let d = 1; d <= daysInMonth; d++) {
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const hasEvents = eventsData[dateKey] && eventsData[dateKey].length > 0;
            const eventCount = hasEvents ? eventsData[dateKey].length : 0;
            const isToday = dateKey === todayStr;
            
            let dayClass = "day";
            if (hasEvents) dayClass += " has-event";
            if (isToday) dayClass += " today";
            
            // Event indicators (mini dots)
            let indicators = '';
            if (hasEvents) {
                const dots = Math.min(eventCount, 3);
                for (let i = 0; i < dots; i++) {
                    indicators += `<span class="mini-dot"></span>`;
                }
            }
            
            // Event count badge
            let eventBadge = '';
            if (eventCount > 0) {
                eventBadge = `<span class="event-count">${eventCount}</span>`;
            }

            cal.innerHTML += `
                <div class="${dayClass}" onclick="openPopup('${dateKey}')" title="${hasEvents ? eventCount + ' event(s)' : 'No events'}">
                    <span class="date-number">${d}</span>
                    ${eventBadge}
                    ${hasEvents ? `<div class="event-indicators">${indicators}</div>` : ''}
                </div>
            `;
        }
    }

    // ===== OPEN POPUP =====
    function openPopup(dateKey) {
        const popup = document.getElementById("popup");
        const popupTitle = document.getElementById("popupTitle");
        const popupDate = document.getElementById("popupDate");
        const popupEvents = document.getElementById("popupEvents");

        // Format date for display
        const dateParts = dateKey.split('-');
        const d = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
        const formattedDate = d.toLocaleDateString('en-US', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });

        popupDate.textContent = formattedDate;

        const events = eventsData[dateKey] || [];

        if (events.length === 0) {
            popupTitle.textContent = "No Events";
            popupEvents.innerHTML = `<p class="no-events-msg">No programs on this day.</p>`;
        } else {
            popupTitle.textContent = `📅 ${events.length} Event${events.length > 1 ? 's' : ''}`;
            
            let html = '<ul class="event-list">';
            events.forEach(event => {
                html += `
                    <li>
                        <span class="event-title">${event.title}</span>
                        <div class="event-meta">
                            <span><i class="fas fa-clock"></i> ${event.time}</span>
                            <span class="location"><i class="fas fa-map-marker-alt"></i> ${event.location}</span>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            popupEvents.innerHTML = html;
        }

        popup.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    // ===== CLOSE POPUP =====
    function closePopup() {
        document.getElementById("popup").style.display = "none";
        document.body.style.overflow = "";
    }

    // ===== CHANGE MONTH =====
    function changeMonth(step) {
        let newMonth = currentMonth + step;
        let newYear = currentYear;
        
        if (newMonth > 12) {
            newMonth = 1;
            newYear++;
        } else if (newMonth < 1) {
            newMonth = 12;
            newYear--;
        }
        
        window.location.href = `?year=${newYear}&month=${newMonth}`;
    }

    // ===== CLOSE POPUP ON OUTSIDE CLICK =====
    window.onclick = function(e) {
        if (e.target.id === "popup") {
            closePopup();
        }
    }

    // ===== CLOSE POPUP ON ESCAPE =====
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePopup();
        }
    });

    // ===== INITIAL RENDER =====
    renderCalendar(currentYear, currentMonth);
</script>

<!-- ========================================
   SIDEBAR TOGGLE (if needed)
======================================== -->
<script>
    // Sidebar toggle functionality (if you have a sidebar)
    const toggleBtn = document.getElementById('sidebarToggleBtn');
    const sidebar = document.getElementById('sidebarPanel');
    const overlay = document.getElementById('sidebarOverlay');

    if (toggleBtn && sidebar && overlay) {
        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            toggleBtn.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            toggleBtn.classList.remove('active');
            document.body.style.overflow = '';
        }

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                openSidebar();
            }
        });

        overlay.addEventListener('click', closeSidebar);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                closeSidebar();
            }
        });
    }
</script>

<!-- Dropdown functionality -->
<script>
    document.querySelectorAll(".menu-link").forEach(link => {
        link.addEventListener("click", function () {
            const dropdown = this.parentElement;
            document.querySelectorAll(".dropdown").forEach(item => {
                if (item !== dropdown) {
                    item.classList.remove("active");
                }
            });
            dropdown.classList.toggle("active");
        });
    });
</script>
