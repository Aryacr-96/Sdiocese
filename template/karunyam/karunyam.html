{% load static %}
{% include 'header.html' %}

<style>
.karunya-intro{
    margin-left: 40px;
    margin-right: 1px;
    display:grid;
    grid-template-columns:1fr 500px;
    gap:70px;
    align-items:start;
    padding:0 30px;
    margin-top: 60px;
    margin-bottom: 60px;
}

.section-tag{
    color: #dd7e43;
    font-weight:700;
    letter-spacing:2px;
    font-size:13px;
}

.intro-content h2{
    font-size:32px;
    color:#23395d;
    margin:20px 0;
}

.intro-content p{
    color:#666;
    line-height:1.9;
    margin-bottom:20px;
    text-align:justify;
    font-size:13px;
}

/* Sticky image container - FIXED */
.intro-image{
    position:sticky;
    top:100px;
    align-self:start;
    width:100%;
    max-width:500px;
}

.intro-image img{
    width:100%;
    height:380px;
    border-radius:30px;
    box-shadow:0 25px 50px rgba(0,0,0,.15);
    object-fit:cover;
    display:block;
}

@media(max-width:992px){
    .karunya-intro{
        grid-template-columns:1fr;
        gap:40px;
        padding:0 20px;
    }

    .intro-content h2{
        font-size:28px;
    }

    /* Disable sticky on mobile */
    .intro-image{
        position:static;
        max-width:100%;
    }
    
    .intro-image img{
        height:300px;
    }
}

@media(max-width:576px){
    .karunya-intro{
        padding:0 15px;
        margin-top:30px;
    }
    
    .intro-content h2{
        font-size:24px;
    }
    
    .intro-image img{
        height:220px;
        border-radius:20px;
    }
}
</style>

<section class="karunya-intro">

    <div class="intro-content">
        {% if about %}
            <span class="section-tag">ABOUT KARUNYA SPARSHAM</span>
            <h2>{{ about.title }}</h2>
            <p>{{ about.content|safe }}</p>
        {% endif %}
    </div>

    <div class="intro-image">
        {% if about.image %}
            <img src="{{ about.image.url }}" alt="{{ about.title }}">
        {% else %}
            <img src="{% static 'images/default-karunya.jpg' %}" alt="Karunya Sparsham">
        {% endif %}
    </div>

</section>
</div>
{% include 'footer.html' %}

<script>
const toggleBtn = document.getElementById('sidebarToggleBtn');
const sidebar = document.getElementById('sidebarPanel');
const overlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('active');
    toggleBtn.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
    toggleBtn.classList.remove('active');
    document.body.style.overflow = '';
}

toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sidebar.classList.contains('open')) {
        closeSidebar();
    } else {
        openSidebar();
    }
});

overlay.addEventListener('click', closeSidebar);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
        closeSidebar();
    }
});
</script>

<script>
document.querySelectorAll(".menu-link").forEach(link => {
    link.addEventListener("click", function () {
        const dropdown = this.parentElement;

        document.querySelectorAll(".dropdown").forEach(item => {
            if (item !== dropdown) {
                item.classList.remove("active");
            }
        });

        dropdown.classList.toggle("active");
    });
});
</script>

<script>
const historyBlocks = document.querySelectorAll('.history-block');

window.addEventListener('scroll', () => {
    historyBlocks.forEach(block => {
        const rect = block.getBoundingClientRect();
        const isMiddle = rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2;

        if (isMiddle) {
            block.style.setProperty('--line-color', '#e76514');
        } else {
            block.style.setProperty('--line-color', 'rgba(231, 101, 20, 0.2)');
        }
    });
});
</script>

</body>
</html>
