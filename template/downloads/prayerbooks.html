{% load static %}
{% include 'header.html' %}

<style>

/* WRAPPER */
.prayer-wrapper{
    max-width:1200px;
    margin:60px auto;
    padding:0 20px;
}

/* TITLE */
.prayer-title{
    font-size:32px;
    font-weight:600;
    color:#2a4564;
    position:relative;
    display:inline-block;
    margin-bottom:50px;
    margin-left: 400px;
}
.prayer-title::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-15px;
    width:70px;
    height:4px;
    background:#e76514;
    transform:translateX(-50%);
    border-radius:20px;
}

/* GRID */
.prayer-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}
.prayer-grid a{
    text-decoration: none;
}
/* PRAYER CARD */
.prayer-card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:all .3s ease;
}

.prayer-card:hover{
    transform:translateY(-6px);
}

/* IMAGE */
.prayer-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}

/* TITLE INSIDE CARD */
.prayer-card h3{
    font-size:18px;
    color:#23395d;
    margin-bottom:15px;
}

/* BUTTON */
.prayer-btn{
    display:inline-block;
    padding:10px 20px;
    background:#e76514;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
}

.prayer-btn:hover{
    background:#c9500f;
    color:#fff;
}

/* RESPONSIVE */
@media(max-width:992px){
    .prayer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:576px){
    .prayer-grid{
        grid-template-columns:1fr;
    }

    .prayer-title{
        font-size:26px;
    }
}

</style>

<!-- JAVASCRIPT -->
<script>
const toggleBtn = document.getElementById('sidebarToggleBtn');
const sidebar = document.getElementById('sidebarPanel');
const overlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('active');
    toggleBtn.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
    toggleBtn.classList.remove('active');
    document.body.style.overflow = '';
}

toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sidebar.classList.contains('open')) {
        closeSidebar();
    } else {
        openSidebar();
    }
});

overlay.addEventListener('click', closeSidebar);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
        closeSidebar();
    }
});
</script>

<script>
document.querySelectorAll(".menu-link").forEach(link => {
    link.addEventListener("click", function () {
        const dropdown = this.parentElement;

        document.querySelectorAll(".dropdown").forEach(item => {
            if (item !== dropdown) {
                item.classList.remove("active");
            }
        });

        dropdown.classList.toggle("active");
    });
});
</script>
<script>const historyBlocks = document.querySelectorAll('.history-block');

window.addEventListener('scroll', () => {
    historyBlocks.forEach(block => {
        const rect = block.getBoundingClientRect();
        
        // This check defines the "active" zone (the center of your screen)
        const isMiddle = rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2;

        if (isMiddle) {
            // Change to active color while scrolling
            block.style.setProperty('--line-color', '#e76514');
        } else {
            // Reset to inactive color when not scrolling over this block
            block.style.setProperty('--line-color', 'rgba(231, 101, 20, 0.2)');
        }
    });
});</script>
